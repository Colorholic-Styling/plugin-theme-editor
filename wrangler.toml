name = "worker-cms-plugin-theme-editor"
main = "src/index.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Plugin admin views live directly under views/. Production themes live in the
# THEMES bucket and are not generated as part of deployment.
[assets]
directory = "./.dist/views"
binding = "VIEWS"
run_worker_first = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
CMS_URL = "https://cms.eventuai.com"
# GitHub App identity values are safe as vars. Configure the private key,
# client secret, and state secret with `wrangler secret put`; see README.
GITHUB_APP_ID = "4438299"
GITHUB_APP_SLUG = "eventuai-theme-editor"
GITHUB_APP_CLIENT_ID = "Iv23li3rHFYFrjmqLsk5"


# Section visibility is a per-template decision, so those overrides need their
# own writable store. Local
# `wrangler dev` runs against Miniflare's on-disk KV and ignores this id;
# provision a real namespace before deploying with:
#   npm run kv:setup -- --binding=THEME_OVERRIDES
[[kv_namespaces]]
binding = "THEME_OVERRIDES"
id = "5881153cac594025ac7f2e19bd8ffadb"

# Tenant-scoped GitHub App installation metadata. It stores installation ids,
# never GitHub access tokens. Provision with:
#   npm run kv:setup -- --binding=GITHUB_CONNECTIONS
[[kv_namespaces]]
binding = "GITHUB_CONNECTIONS"
id = "fc06bde2f4524f8ab53209cb81866ab3"

# The theme library. The bucket is the root: every top-level folder is a theme,
# so `example-theme/templates/page.json` is that theme's page template.
# Unlike the asset bundle this Worker can write it, which is what lets a
# deployed editor publish. `wrangler dev` simulates it locally, and
# `npm run theme:push` can fill it.
[[r2_buckets]]
binding = "THEMES"
bucket_name = "cms-themes"

# Set this plugin's dedicated CMS registration secret with:
#   wrangler secret put PLUGIN_SECRET
#
# For multi-tenant deployment bind a TENANTS KV namespace. Local development
# can use CMS_URL + PLUGIN_SECRET until the registry is configured.
[[kv_namespaces]]
binding = "TENANTS"
id = "560f47c46bc04bb08d4ed1fdad839be9"
